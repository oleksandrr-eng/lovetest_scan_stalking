<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff4f9a">
<title>LoveScan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Значения по умолчанию — реальные цвета/шрифты задаются из CONFIG.theme / CONFIG.fonts */
  :root {
    --main: #ff4f9a;
    --second: #b94bec;
    --ink: #7a2952;
    --ink-soft: #a84c7d;
    --soft: #ffe0ee;
    --accent: #ffb3d6;
    --print-base: #f3a3c8;
    --bg1: #fff0f7;
    --bg2: #ffd3e8;
    --bg3: #f1c6ff;
    --card-bottom: #fff2f8;
    --shadow: rgba(220, 60, 150, .4);
    --overlay: rgba(120, 30, 80, .38);
    --font-title: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
    --font-text: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --grad: linear-gradient(90deg, var(--main), var(--second));
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font-text); color: var(--ink); text-align: center;
    background: var(--bg2) radial-gradient(120% 70% at 20% 0%, var(--bg1), var(--bg2) 45%, var(--bg3)) fixed;
    touch-action: manipulation;
  }

  button { font: inherit; cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 0.1s ease; }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 4px solid var(--second); outline-offset: 4px; }

  .screen {
    position: relative; z-index: 1; height: 100dvh; max-width: 460px; margin: 0 auto;
    padding-block: clamp(12px, 3dvh, 28px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2dvh, 18px);
    overflow-y: auto;
  }
  .card {
    width: 100%; max-width: 420px; border-radius: 34px; padding: clamp(16px, 3dvh, 28px) 20px;
    background: linear-gradient(180deg, #fff, var(--card-bottom)); box-shadow: 0 24px 60px var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 16px);
  }
  .logo { font-family: var(--font-title); font-weight: 700; font-size: 1.25rem; color: var(--main); }
  .grad-text { background: linear-gradient(180deg, var(--main), var(--second)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1, h2 { margin: 0; font-family: var(--font-title); line-height: 1.05; text-wrap: balance; }
  h1 { font-size: clamp(1.9rem, min(11vw, 6dvh), 3.4rem); }
  p { margin: 0; font-weight: 700; line-height: 1.4; color: var(--ink-soft); }
  .btn {
    width: 100%; min-height: clamp(48px, 7dvh, 62px); border-radius: 999px; color: #fff; background: var(--grad);
    font-family: var(--font-title); font-weight: 600; font-size: 1.3rem; box-shadow: 0 12px 26px var(--shadow);
    animation: nudge 1.8s 1s infinite;
  }
  .btn:active { animation: none; }
  .link-btn { background: none; padding: 4px 10px; font-weight: 800; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }

  #bgIcons { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #bgIcons span { position: absolute; bottom: -40px; animation: rise linear infinite; }

  /* game */
  .big-icon { font-size: clamp(3.5rem, min(34vw, 15dvh), 9.5rem); line-height: 1; animation: beat 1.4s infinite; }
  .counter { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.85); font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #scanBtn {
    position: relative; width: clamp(116px, 19dvh, 168px); aspect-ratio: 1; border-radius: 50%; margin-top: 8px;
    background: linear-gradient(160deg, #fff, var(--soft)); transition: transform .15s;
    box-shadow: 0 0 0 10px rgba(255,255,255,.6), 0 12px 34px var(--shadow);
  }
  #scanBtn:active, #scanBtn.scanning { transform: scale(.94); }
  #scanBtn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scan-emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(2.8rem, 8dvh, 4.2rem); line-height: 1; filter: grayscale(1); opacity: .5; }
  #status { font-family: var(--font-title); font-weight: 600; font-size: clamp(1.05rem, 5.4vw, 1.35rem); color: var(--main); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar, .meter-bar { width: 100%; height: 12px; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .bar { width: 220px; background: rgba(255,255,255,.75); visibility: hidden; }
  .bar.on { visibility: visible; }
  .bar i, .meter-bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--grad); }

  /* result */
  #result {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; overflow-y: auto; background: var(--overlay);
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  #result .card { animation: pop .6s cubic-bezier(.2, 1.5, .4, 1); }
  #result h2 { font-size: clamp(1.2rem, min(6.4vw, 3.2dvh), 1.95rem); }
  .photo { flex: none; width: min(240px, 60vw, 26dvh); height: min(240px, 60vw, 26dvh); padding: 8px; border-radius: 50%; background: conic-gradient(var(--main), var(--accent), var(--second), var(--main)); }
  .photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .phrase { font-family: var(--font-title); font-weight: 600; font-size: clamp(1.1rem, 3dvh, 1.45rem); color: var(--ink); text-wrap: balance; }
  .phrase small { display: block; margin-top: 4px; font-family: var(--font-text); font-size: 1rem; color: var(--ink-soft); }
  .meter { width: 100%; }
  .meter-top { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 18px; background: var(--soft); }
  .stat .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); animation: bob 2.4s infinite; font-size: 18px; }
  .stat .ico { overflow: hidden; }
  .stat .ico img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .stat b { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .stat span.val { font-weight: 800; font-size: .86rem; overflow-wrap: anywhere; }
  .stat small { font-weight: 700; color: var(--ink-soft); }

  @keyframes rise { to { transform: translate(-10px, -115vh) rotate(-12deg); } }
  @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.07); } 45% { transform: scale(1.04); } }
  @keyframes nudge { 0%, 70%, 100% { transform: scale(1); } 85% { transform: scale(1.05); } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="bgIcons" aria-hidden="true"></div>

<!-- 1. Игра -->
<section class="screen" id="game">
  <div class="logo" id="ui-logo"></div>
  <h1 class="grad-text" id="ui-title"></h1>
  <p id="ui-subtitle"></p>
  <div class="big-icon" id="ui-icon" aria-hidden="true"></div>
  <div class="counter" id="counterBox"><span id="counter"></span> <span id="ui-counter-text"></span></div>
  <button id="scanBtn" type="button">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle id="ring" cx="60" cy="60" r="56" fill="none" stroke="var(--main)" stroke-width="3.5" stroke-linecap="round"
              pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 60 60)"/>
      <clipPath id="clip"><rect id="clipRect" x="0" y="124" width="120" height="0"/></clipPath>
      <g id="printGroup" transform="translate(22 20) scale(.63)" fill="none" stroke-width="4" stroke-linecap="round">
        <g id="printBase" stroke="var(--print-base)"></g>
        <g id="printFill" stroke="var(--main)" clip-path="url(#clip)"></g>
      </g>
    </svg>
    <span class="scan-emoji" id="scanEmoji" aria-hidden="true" hidden></span>
  </button>
  <div id="status"></div>
  <div class="bar" id="bar"><i id="barFill"></i></div>
</section>

<!-- 2. Результат -->
<div id="result" hidden role="dialog" aria-modal="true" aria-labelledby="ui-res-title">
  <div class="card">
    <h2 class="grad-text" id="ui-res-title"></h2>
    <div class="photo"><img id="photo" alt=""></div>
    <p class="phrase"><span id="phrase"></span><small id="phraseSub"></small></p>
    <div class="meter" id="meter">
      <div class="meter-top"><span id="ui-meter-text"></span><span id="meterNum">0%</span></div>
      <div class="meter-bar"><i id="meterFill"></i></div>
    </div>
    <div class="stats" id="stats"></div>
    <button class="btn" id="ctaBtn" type="button"></button>
    <button class="link-btn" id="againBtn" type="button" hidden></button>
  </div>
</div>

      scanAria: 'Сканировать отпечаток',
      followers: 'подписчиков',
    },
    phrases: [
      { line1: 'Он тайно влюблён в тебя', line2: 'и думает о тебе каждый день' },
      { line1: 'Ты нравишься ему больше, чем друг', line2: 'и он надеется, что это взаимно' },
    ],
  },

  ocean: {
    bgIcons: ['💙', '✨', '🤍', '💜'],
    text: { logo: '💙 LoveScan', mainIcon: '💙' },
    theme: {
      main: '#2f8cff', second: '#6a4bff', ink: '#1f3a6b', inkSoft: '#4a6a9c',
      soft: '#e0ecff', accent: '#b3d4ff', printBase: '#a3c4f3',
      bg1: '#f0f7ff', bg2: '#d3e6ff', bg3: '#d6c6ff', cardBottom: '#f2f7ff',
      shadow: 'rgba(60, 110, 220, .4)', overlay: 'rgba(30, 50, 120, .38)',
    },
  },
};

// Пресеты, которые включены, если в ссылке нет ?p=  (например 'ru' или 'ru,ocean')
const DEFAULT_PRESETS = '';

/* ==========================================================
   3. ЛОГИКА — обычно трогать не нужно
   ========================================================== */
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b) {
  if (!isObj(b)) return b;
  const out = { ...a };
  for (const k in b) out[k] = isObj(a?.[k]) && isObj(b[k]) ? merge(a[k], b[k]) : b[k];
  return out;
}

const query = new URLSearchParams(location.search);
const CONFIG = (query.get('p') ?? DEFAULT_PRESETS)
  .split(',').map(s => s.trim()).filter(Boolean)
  .reduce((cfg, name) => PRESETS[name] ? merge(cfg, PRESETS[name]) : cfg, BASE);

const $ = id => document.getElementById(id);
const rand = (min, max) => min + Math.random() * (max - min);
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const t = s => String(s ?? '').replace(/\{(\w+)\}/g, (m, k) => CONFIG.text[k] ?? m);
const setHTML = (id, s) => { $(id).innerHTML = t(s); $(id).hidden = !s; };
const setText = (id, s) => { $(id).textContent = t(s); $(id).hidden = !s; };

// --- Тема, шрифты, мета ---
const root = document.documentElement;
root.lang = CONFIG.lang;
document.title = CONFIG.pageTitle;
for (const [k, v] of Object.entries(CONFIG.theme || {})) {
  root.style.setProperty('--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()), v);
}
document.querySelector('meta[name="theme-color"]').content = CONFIG.theme.main;
if (CONFIG.fonts?.url) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = CONFIG.fonts.url;
  document.head.appendChild(link);
}
if (CONFIG.fonts?.title) root.style.setProperty('--font-title', CONFIG.fonts.title);
if (CONFIG.fonts?.text) root.style.setProperty('--font-text', CONFIG.fonts.text);

// --- Тексты ---
setHTML('ui-logo', CONFIG.text.logo);
setHTML('ui-title', CONFIG.text.title);
setHTML('ui-subtitle', CONFIG.text.subtitle);
setHTML('ui-icon', CONFIG.text.mainIcon);
setHTML('ui-res-title', CONFIG.text.resultTitle);
setHTML('ui-meter-text', CONFIG.text.meter);
setHTML('ctaBtn', CONFIG.text.button);
setHTML('againBtn', CONFIG.text.again);
$('scanBtn').setAttribute('aria-label', t(CONFIG.text.scanAria));
$('status').textContent = t(CONFIG.text.tap);

// --- Предзагрузка фото ---
CONFIG.items.forEach(it => { if (it.photo) new Image().src = it.photo; });

// --- Летающие иконки на фоне ---
if (CONFIG.bgIcons?.length) {
  for (let i = 0; i < CONFIG.bgCount; i++) {
    const s = document.createElement('span');
    s.textContent = CONFIG.bgIcons[Math.floor(Math.random() * CONFIG.bgIcons.length)];
    s.style.cssText = `left:${rand(0, 100)}%;font-size:${rand(14, 36)}px;opacity:${rand(.35, .75)};` +
                      `animation-duration:${rand(10, 22)}s;animation-delay:-${rand(0, 20)}s`;
    $('bgIcons').appendChild(s);
  }
}

// --- Иконка сканера: отпечаток или эмодзи ---
const emojiMode = CONFIG.scanIcon !== 'fingerprint';
if (emojiMode) {
  $('printGroup').style.display = 'none';
  $('scanEmoji').textContent = CONFIG.scanIcon;
  $('scanEmoji').hidden = false;
} else {
  $('printBase').innerHTML = $('printFill').innerHTML =
    ['70 30', '40 6 44 10', '30 5 26 6 22 11', '52 8 28 12', '22 6 30 5 24 13', '36 7 20 6 18 13', '28 5 40 8 6 13', '46 6 30 18', '34 7 24 35']
      .map((dash, i) => {
        const ry = 7 + i * 6.4, rx = ry * .82;
        return `<path d="M60 ${66 - ry}A${rx} ${ry} 0 1 1 59.99 ${66 - ry}Z" pathLength="100" stroke-dasharray="${dash}" stroke-dashoffset="${i * 17 % 100}"/>`;
      }).join('');
}

// --- Счётчик ---
if (CONFIG.counter) {
  const c = CONFIG.counter;
  let count = c.start;
  const show = () => { $('counter').textContent = count.toLocaleString(c.locale); };
  setText('ui-counter-text', CONFIG.text.counter);
  show();
  setInterval(() => { count += Math.round(rand(c.stepMin, c.stepMax)); show(); }, c.everyMs);
} else {
  $('counterBox').hidden = true;
}

// --- Анимация ---
function animate(seconds, onFrame, onDone) {
  const start = performance.now();
  requestAnimationFrame(function frame(now) {
    const p = Math.min(1, (now - start) / (seconds * 1000));
    onFrame(ease(p));
    if (p < 1) requestAnimationFrame(frame); else if (onDone) onDone();
  });
}

function setScan(p) {
  $('clipRect').setAttribute('y', 124 - p * 124);
  $('clipRect').setAttribute('height', p * 124);
  $('ring').setAttribute('stroke-dasharray', `${p * 100} 100`);
  $('barFill').style.width = p * 100 + '%';
  if (emojiMode) {
    $('scanEmoji').style.filter = `grayscale(${1 - p})`;
    $('scanEmoji').style.opacity = .5 + p * .5;
  }
}

// --- Выбор результата и фразы ---
function makePicker(arr) {
  let last = -1, n = 0;
  return () => {
    if (!arr?.length) return null;
    if (CONFIG.pickMode === 'order') return arr[n++ % arr.length];
    let i;
    do { i = Math.floor(Math.random() * arr.length); } while (i === last && arr.length > 1);
    last = i;
    return arr[i];
  };
}
const nextItem = makePicker(CONFIG.items);
const nextPhrase = makePicker(CONFIG.phrases);

// --- Ссылка кнопки ---
function ctaUrl(item) {
  const raw = item?.url || CONFIG.cta?.url;
  if (!raw) return '';
  const u = new URL(raw, location.href);
  if (CONFIG.cta.passQuery) {
    query.forEach((v, k) => { if (k !== 'p' && !u.searchParams.has(k)) u.searchParams.set(k, v); });
  }
  return u.toString();
}

// --- Блоки статистики ---
function renderStats(stats) {
  const box = $('stats');
  box.replaceChildren(...stats.map(s => {
    const el = document.createElement('div');
    el.className = 'stat';
    const ico = CONFIG.icons?.[s.ico] || s.ico;
    if (ico) {
      const wrap = document.createElement('span');
      wrap.className = 'ico';
      if (/^(https?:|data:|\/|\.)/.test(ico)) {
        const img = document.createElement('img');
        img.src = ico; img.alt = '';
        wrap.appendChild(img);
      } else {
        wrap.textContent = ico;   // эмодзи
      }
      el.appendChild(wrap);
    }
    [['b', s.name], ['span', s.val, 'val'], ['small', s.sub]].forEach(([tag, txt, cls]) => {
      if (!txt) return;
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      n.textContent = t(txt);
      el.appendChild(n);
    });
    return el;
  }));
  box.hidden = !stats.length;
}

// --- Сканирование ---
let busy = false, currentItem = null;

$('scanBtn').onclick = () => {
  if (busy) return;
  busy = true;
  $('scanBtn').classList.add('scanning');
  $('bar').classList.add('on');
  animate(CONFIG.scanSeconds,
    p => { setScan(p); $('status').textContent = `${t(CONFIG.text.scanning)} ${Math.round(p * 100)}%`; },
    () => { $('status').textContent = t(CONFIG.text.found); setTimeout(showResult, 300); });
};

function showResult() {
  const item = nextItem() || {};
  currentItem = item;
  const phrase = (item.line1 || item.line2) ? item : (nextPhrase() || {});

  $('photo').src = item.photo || '';
  $('photo').style.objectPosition = item.focus || '50% 50%';
  $('photo').parentElement.hidden = !item.photo;
  setText('phrase', phrase.line1);
  setText('phraseSub', phrase.line2);
  renderStats(item.stats || []);
  $('againBtn').hidden = !ctaUrl(item) || !CONFIG.text.again;

  $('result').hidden = false;

  if (CONFIG.meter) {
    $('meter').hidden = false;
    const target = rand(CONFIG.meter.min, CONFIG.meter.max);
    animate(1.2, p => {
      $('meterFill').style.width = p * target + '%';
      $('meterNum').textContent = Math.round(p * target) + '%';
    });
  } else {
    $('meter').hidden = true;
  }
}

function restart() {
  $('result').hidden = true;
  $('scanBtn').classList.remove('scanning');
  $('bar').classList.remove('on');
  $('status').textContent = t(CONFIG.text.tap);
  setScan(0);
  busy = false;
}

$('ctaBtn').onclick = () => {
  const url = ctaUrl(currentItem);
  if (!url) return restart();
  if (CONFIG.cta.newTab) window.open(url, '_blank', 'noopener');
  else location.href = url;
};
$('againBtn').onclick = restart;
</script>
</body>
</html>
